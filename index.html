<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiMerge TD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Pixel Digivolve';
      src: url('./assets/fonts/PixelDigivolve.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0a14; overflow: hidden; }
    #game-container { width: 100vw; height: 100vh; }
    #game-container canvas {
      /* Removed image-rendering: pixelated — it made text blocky when canvas is scaled.
         Phaser pixelArt:true handles sprite NEAREST filtering internally. */
    }
    /* High score name input */
    .digimerge-name-input {
      background: rgba(15, 10, 20, 0.9);
      border: 2px solid #00ddff;
      border-radius: 6px;
      color: #ffffff;
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      padding: 8px 12px;
      width: 200px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    .digimerge-name-input:focus {
      border-color: #ffdd44;
      box-shadow: 0 0 8px rgba(255, 221, 68, 0.3);
    }
    .digimerge-name-input::placeholder {
      color: #556677;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
